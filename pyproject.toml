[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voidformer"
version = "0.1.0"
description = "Virtual Quantum Computing Simulator & Processor for Neural Language Models"
authors = [{ name = "VoidFormer Team" }]
dependencies = [
    "torch>=2.0.0",
    "qiskit>=1.1.0",
    "qiskit-aer>=0.14.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "datasets>=2.0.0",
    "tensorboard>=2.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voidformer*"]
exclude = ["tests*", "harness-plugins*"]
